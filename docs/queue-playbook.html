<title>Queue Playbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,400;87.5,600;100,400;100,600;100,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#1F2A33; --muted:#5E6B76; --line:#D3D9DF;
  --amber:#E0A43A; --amber-ink:#3A2A08; --teal:#2A7F8E; --teal-soft:#D7EBEE;
  --red:#C8463A; --red-soft:#F6DDDA; --green:#3E9B5F; --green-soft:#DCEFE2;
  --focus:#2A7F8E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181D; --panel:#1C2229; --ink:#E6EBEF; --muted:#9AA6B1; --line:#2E3842;
    --amber:#E9B04A; --amber-ink:#2A1E05; --teal:#4FA7B6; --teal-soft:#1E3A40;
    --red:#E0675B; --red-soft:#3E2220; --green:#5DB97D; --green-soft:#1F3A29;
  }
}
:root[data-theme="dark"]{
  --bg:#14181D; --panel:#1C2229; --ink:#E6EBEF; --muted:#9AA6B1; --line:#2E3842;
  --amber:#E9B04A; --amber-ink:#2A1E05; --teal:#4FA7B6; --teal-soft:#1E3A40;
  --red:#E0675B; --red-soft:#3E2220; --green:#5DB97D; --green-soft:#1F3A29;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
header{padding:28px 32px 10px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;font-stretch:87.5%}
header p{margin:0;color:var(--muted)}
.app{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:10px 32px 40px;max-width:1240px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;display:flex;gap:10px;align-items:baseline;color:var(--ink)}
nav button .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);min-width:18px}
nav button:hover{background:var(--panel)}
nav button[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--teal)}
nav button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.title h2{margin:0;font-size:20px;font-weight:600;text-wrap:balance}
.title .step{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:13px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.say{min-height:72px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:16px;max-width:none}
.say b{font-weight:600}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls button{all:unset;cursor:pointer;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px}
.controls button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls button:disabled{opacity:.4;cursor:default}
.controls button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.controls .hint{color:var(--muted);font-size:13px;margin-left:auto}
.remember{border-left:3px solid var(--amber);padding:10px 16px;background:var(--panel);border-radius:0 8px 8px 0}
.remember .k{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.remember p{margin:4px 0 0;font-size:16px;font-weight:600;text-wrap:balance}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:0 4px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
/* SVG */
svg text{font-family:Archivo,system-ui,sans-serif;fill:var(--ink)}
svg .lbl{font-size:13px;font-weight:600}
svg .sub{font-size:11px;fill:var(--muted);font-family:"IBM Plex Mono",monospace}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;rx:8}
svg .box.queue{fill:var(--teal-soft);stroke:var(--teal)}
svg .box.dlq{fill:var(--red-soft);stroke:var(--red)}
svg .box.db{fill:var(--panel);stroke:var(--ink);stroke-dasharray:4 3}
svg .box.hot{stroke-width:3}
svg .box.crash{fill:var(--red-soft);stroke:var(--red)}
svg .box.ok{fill:var(--green-soft);stroke:var(--green)}
svg .slot{fill:none;stroke:var(--teal);stroke-opacity:.35;stroke-dasharray:3 3}
svg .msg{transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .4s}
svg .msg rect{fill:var(--amber);stroke:var(--amber-ink);stroke-opacity:.35;rx:5}
svg .msg text{fill:var(--amber-ink);font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500}
svg .msg.hidden rect{fill-opacity:.35;stroke-dasharray:3 2}
svg .msg.hidden text{fill-opacity:.55}
svg .msg.dead rect{fill:var(--red)} svg .msg.dead text{fill:#fff}
svg .msg .cnt{fill:var(--ink)} svg .msg .cnt text{fill:var(--bg);font-size:10px;font-weight:600}
svg .msg.gone{opacity:0}
svg .note{font-size:12px;fill:var(--muted)}
svg .note.red{fill:var(--red);font-weight:600} svg .note.green{fill:var(--green);font-weight:600}
svg .clock{font-family:"IBM Plex Mono",monospace;font-size:13px;fill:var(--muted)}
svg .arrow{stroke:var(--line);stroke-width:1.5;fill:none;marker-end:url(#ah)}
@media (prefers-reduced-motion: reduce){ svg .msg{transition:none} }
@media (max-width:820px){ .app{grid-template-columns:1fr} nav{flex-direction:row;flex-wrap:wrap} nav button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--teal)} }
</style>

<header>
  <h1>Queue Playbook</h1>
  <p>Nine cases, stepped one frame at a time. Built from the order-pipeline design.</p>
</header>

<div class="app">
  <nav id="nav" aria-label="Cases"></nav>
  <main>
    <div class="title"><h2 id="caseTitle"></h2><span class="step mono" id="stepLabel"></span></div>
    <div class="stage"><svg id="svg" viewBox="0 0 900 360" role="img" aria-labelledby="caseTitle"></svg></div>
    <div class="say" id="say"></div>
    <div class="controls">
      <button id="prev">← Back</button>
      <button id="next" class="primary">Next →</button>
      <button id="play">Play</button>
      <button id="reset">Restart</button>
      <span class="hint">Arrow keys step. Space plays.</span>
    </div>
    <div class="remember"><div class="k">Remember this</div><p id="remember"></p></div>
    <div class="legend">
      <span><i style="background:var(--amber)"></i>message</span>
      <span><i style="background:var(--amber);opacity:.35;outline:1px dashed var(--amber-ink)"></i>in flight (hidden, stopwatch running)</span>
      <span><i style="background:var(--teal-soft);outline:1px solid var(--teal)"></i>queue</span>
      <span><i style="background:var(--red-soft);outline:1px solid var(--red)"></i>crash / dead-letter</span>
      <span><i style="background:var(--green-soft);outline:1px solid var(--green)"></i>acked / done</span>
    </div>
  </main>
</div>

<script>
// ---------- scene model ----------
// box: {id,x,y,w,h,label,sub,kind}   kind: web|queue|worker|db|provider|dlq|user
// step: {say, msgs:{id:{at,slot,hidden,count,dead,gone,label}}, hot:[ids], crash:[ids], ok:[ids], clock, notes:[{x,y,text,cls}], subs:{boxId:text}}
const SLOT_W = 66, SLOT_H = 26;

function box(id,x,y,w,h,label,kind,sub){ return {id,x,y,w,h,label,kind,sub:sub||""}; }

// positions: a message "at" a box sits in slot n (0-based) inside it, or centered if box has no slots
function msgPos(b, slot){
  if(b.kind==="queue"||b.kind==="dlq"){
    const cols = Math.max(1, Math.floor((b.w-16)/(SLOT_W+6)));
    const c = slot % cols, r = Math.floor(slot/cols);
    return {x: b.x+8 + c*(SLOT_W+6), y: b.y+28 + r*(SLOT_H+6)};
  }
  return {x: b.x + b.w/2 - SLOT_W/2, y: b.y + b.h - SLOT_H - 10};
}

// ---------- cases ----------
const CASES = [];

// 1. Basics
{
  const B = [
    box("user",20,140,120,80,"Customer","user","clicks Buy"),
    box("web",190,140,150,80,"Web server","web","answers requests"),
    box("q",400,110,220,140,"Queue","queue","SQS"),
    box("w",680,140,190,80,"Worker","worker","loop: ask, do, ack"),
  ];
  const base = {m1:{at:"user",gone:true}};
  CASES.push({
    title:"1. What a job is, and who touches it",
    remember:"A job is a note describing work. The web server writes it and answers instantly. A worker does it later.",
    boxes:B, arrows:[["user","web"],["web","q"],["q","w"]],
    steps:[
      {say:"A customer clicks <b>Buy</b>. Their browser sends a request to the web server. Doing the real work here would take 30 seconds and the customer would stare at a spinner.", msgs:{m1:{at:"user",gone:true}}, hot:["user"]},
      {say:"Instead the web server writes a <b>message</b>: a few lines of data saying what needs doing. <span class='mono'>{order: 42, step: reserve_stock}</span>. Writing it takes a millisecond.", msgs:{m1:{at:"web",label:"order 42"}}, hot:["web"]},
      {say:"It drops the message into the <b>queue</b> and immediately tells the customer “order received”. The request is over. No work has happened yet.", msgs:{m1:{at:"q",slot:0,label:"order 42"}}, hot:["q"], ok:["user"], notes:[{x:80,y:128,text:"“order received” ✓",cls:"green"}]},
      {say:"A <b>worker</b> is a separate program running in a loop forever: ask the queue for a message, do what it says, tell the queue it's done. It asks now.", msgs:{m1:{at:"q",slot:0,label:"order 42"}}, hot:["w"]},
      {say:"The queue hands the message over. Notice it's still drawn in the queue, faded. The queue didn't delete it, it <b>hid</b> it and started a 30-second stopwatch. The worker starts the real work.", msgs:{m1:{at:"q",slot:0,label:"order 42",hidden:true}, m1b:{at:"w",label:"order 42"}}, hot:["w"], clock:"stopwatch 0:30 → running"},
      {say:"Work done. The worker sends the <b>ack</b>: “delete this message”. Now it's gone for good. The web server and worker never spoke to each other. They only shared the queue.", msgs:{m1:{at:"q",slot:0,gone:true}, m1b:{at:"w",gone:true}}, ok:["w"], notes:[{x:720,y:128,text:"ack → deleted",cls:"green"}]},
    ]
  });
}

// 2. Crash and redelivery
{
  const B = [
    box("q",60,110,260,140,"Queue","queue","visibility timeout 30s"),
    box("a",420,80,200,80,"Worker A","worker"),
    box("b",420,210,200,80,"Worker B","worker"),
  ];
  CASES.push({
    title:"2. A worker dies mid-job",
    remember:"Taking a message hides it, it doesn't delete it. No ack within the stopwatch, and the queue shows it again to whoever asks.",
    boxes:B, arrows:[["q","a"],["q","b"]],
    steps:[
      {say:"One message waits in the queue. Two workers are running.", msgs:{m:{at:"q",slot:0,label:"job 7"}}, clock:"00:00"},
      {say:"Worker A asks first and gets it. The queue hides the message and starts the stopwatch. Worker B asks too, but sees an empty queue.", msgs:{m:{at:"q",slot:0,label:"job 7",hidden:true}, ma:{at:"a",label:"job 7"}}, hot:["a"], clock:"00:00  stopwatch started"},
      {say:"Three seconds in, Worker A's machine loses power. No ack was ever sent. <b>The queue has no idea.</b> It can't see workers. It only sees time passing and whether “delete” arrived.", msgs:{m:{at:"q",slot:0,label:"job 7",hidden:true}, ma:{at:"a",gone:true}}, crash:["a"], clock:"00:03"},
      {say:"Thirty seconds after the hand-out, the stopwatch runs out. The queue's rule: no ack in time means the worker is presumed dead. The message becomes visible again.", msgs:{m:{at:"q",slot:0,label:"job 7"}}, crash:["a"], clock:"00:30  stopwatch expired"},
      {say:"Worker B asks, gets it, does the work, acks. Nothing was lost. This is the good case: the stopwatch exists exactly for this.", msgs:{m:{at:"q",slot:0,label:"job 7",gone:true}, mb:{at:"b",label:"job 7"}}, crash:["a"], ok:["b"], clock:"00:34  acked", notes:[{x:470,y:198,text:"done, deleted",cls:"green"}]},
    ]
  });
}

// 3. Slow job > timeout
{
  const B = [
    box("q",60,110,260,140,"Queue","queue","visibility timeout 30s"),
    box("a",420,80,200,80,"Worker A","worker","healthy, just slow"),
    box("b",420,210,200,80,"Worker B","worker"),
  ];
  CASES.push({
    title:"3. The job takes longer than the stopwatch",
    remember:"A slow-but-alive worker looks identical to a dead one. Set the stopwatch longer than your slowest job, or heartbeat.",
    boxes:B, arrows:[["q","a"],["q","b"]],
    steps:[
      {say:"Same setup. This job takes <b>60 seconds</b>. The stopwatch is 30.", msgs:{m:{at:"q",slot:0,label:"job 9"}}, clock:"00:00"},
      {say:"Worker A takes it and starts working. Hidden, stopwatch running.", msgs:{m:{at:"q",slot:0,label:"job 9",hidden:true}, ma:{at:"a",label:"job 9"}}, hot:["a"], clock:"00:00"},
      {say:"At 30 seconds Worker A is halfway through and perfectly healthy. But the queue can't see that. Stopwatch out, so the message becomes visible again.", msgs:{m:{at:"q",slot:0,label:"job 9"}, ma:{at:"a",label:"job 9"}}, hot:["a"], clock:"00:30  stopwatch expired", notes:[{x:70,y:275,text:"queue thinks A is dead",cls:"red"}]},
      {say:"Worker B asks and gets it. Now <b>two workers are doing the same job</b>. Two PDFs. Two emails.", msgs:{m:{at:"q",slot:0,label:"job 9",hidden:true}, ma:{at:"a",label:"job 9"}, mb:{at:"b",label:"job 9"}}, hot:["a","b"], clock:"00:31", notes:[{x:470,y:68,text:"same job, twice",cls:"red"}]},
      {say:"At 60s Worker A finishes and tries to ack. Its delete ticket is stale because the message was handed out again, so the ack may be ignored. B finishes at 90s and acks for real.", msgs:{m:{at:"q",slot:0,gone:true}, ma:{at:"a",gone:true}, mb:{at:"b",gone:true}}, ok:["b"], clock:"01:30", notes:[{x:470,y:68,text:"A's ack: stale ticket",cls:"red"},{x:470,y:198,text:"B's ack: deleted",cls:"green"}]},
      {say:"Fix one: set the stopwatch longer than your slowest job. Fix two: while working, the worker tells the queue “still on it, 30 more seconds” (a heartbeat). Both are your decision, the queue can't be made smarter.", msgs:{m:{at:"q",slot:0,gone:true}}, clock:"", notes:[{x:70,y:275,text:"timeout > slowest job, or heartbeat",cls:"green"}]},
    ]
  });
}

// 4. DLQ counter
{
  const B = [
    box("q",60,100,260,130,"Queue","queue","maxReceiveCount: 3"),
    box("w",420,110,200,80,"Worker","worker","always crashes on job 4"),
    box("dlq",680,100,200,130,"Dead-letter queue","dlq","a human looks here"),
  ];
  CASES.push({
    title:"4. A poison message and the dead-letter queue",
    remember:"The queue counts hand-outs. At the Nth+1 ask it moves the message aside instead of handing it over. Good jobs get acked before they ever reach N.",
    boxes:B, arrows:[["q","w"],["q","dlq"]],
    steps:[
      {say:"A message that will fail every time, say “email user 42” and user 42 was deleted. Every message carries a hidden counter: how many times it has been handed out. Starts at 0.", msgs:{m:{at:"q",slot:0,label:"job 4",count:0}}, clock:"00:00"},
      {say:"Hand-out 1. Counter becomes 1. Worker tries, crashes, no ack.", msgs:{m:{at:"q",slot:0,label:"job 4",count:1,hidden:true}}, crash:["w"], clock:"00:00"},
      {say:"Stopwatch expires, visible again. Hand-out 2. Counter 2. Crash again.", msgs:{m:{at:"q",slot:0,label:"job 4",count:2,hidden:true}}, crash:["w"], clock:"00:33"},
      {say:"Hand-out 3. Counter 3. Crash a third time. Still in the main queue.", msgs:{m:{at:"q",slot:0,label:"job 4",count:3,hidden:true}}, crash:["w"], clock:"01:06"},
      {say:"Stopwatch expires. Worker asks a <b>fourth</b> time. The queue checks the counter before handing out: it's already 3, the max. So instead of handing it over, AWS moves it to the dead-letter queue. The worker gets nothing.", msgs:{m:{at:"dlq",slot:0,label:"job 4",count:3,dead:true}}, hot:["dlq"], clock:"01:39  moved", notes:[{x:430,y:98,text:"worker sees empty queue",cls:""}]},
      {say:"How did the queue know where to send it? You told it: the <b>redrive policy</b> on the main queue holds the dead-letter queue's address (ARN) and the number 3. The DLQ itself knows nothing, it's a plain queue something points at.", msgs:{m:{at:"dlq",slot:0,label:"job 4",count:3,dead:true}}, notes:[{x:70,y:255,text:"RedrivePolicy = {target: dlq ARN, maxReceiveCount: 3}",cls:""}]},
    ]
  });
}

// 5. Scaling
{
  const B = [
    box("q",60,90,300,180,"Queue","queue","6 messages waiting"),
    box("w1",480,60,180,60,"Worker 1","worker"),
    box("w2",480,150,180,60,"Worker 2","worker"),
    box("w3",480,240,180,60,"Worker 3","worker"),
    box("ext",720,150,160,60,"Email provider","provider","limit: 5/sec"),
  ];
  const six = (hid)=>{ const o={}; for(let i=0;i<6;i++) o["m"+i]={at:"q",slot:i,label:"job "+(i+1),hidden:hid&&hid.includes(i)}; return o; };
  CASES.push({
    title:"5. Going faster: more workers",
    remember:"Scaling is “run the worker command again”. Until the slowest thing each job touches becomes the ceiling.",
    boxes:B, arrows:[["q","w1"],["q","w2"],["q","w3"],["w2","ext"]],
    steps:[
      {say:"Six messages waiting. One worker running. It takes one at a time, three seconds each. Eighteen seconds to drain.", msgs:Object.assign(six([0]),{a:{at:"w1",label:"job 1"}}), hot:["w1"], clock:"1 worker → 18s"},
      {say:"Start two more copies of the <b>same program</b>. Zero code changes. All three ask the queue. The queue hands each a different message and hides each from the others.", msgs:Object.assign(six([0,1,2]),{a:{at:"w1",label:"job 1"},b:{at:"w2",label:"job 2"},c:{at:"w3",label:"job 3"}}), hot:["w1","w2","w3"], clock:"3 workers → 6s"},
      {say:"Order is not promised. Worker 3 might finish job 3 before worker 1 finishes job 1. Most jobs don't care. If yours do, put the dependent steps in one message.", msgs:Object.assign(six([0,1,2]),{a:{at:"w1",label:"job 1"},b:{at:"w2",label:"job 2"},c:{at:"w3",gone:true}}), ok:["w3"], clock:"job 3 done first"},
      {say:"The limit: every job calls the email provider, which allows 5 per second. Thirty workers won't send 30 per second. They'll get “slow down” errors, fail, not ack, and refill the queue with retries. The ceiling is outside your system.", msgs:six([0,1,2]), hot:["ext"], notes:[{x:722,y:138,text:"the real ceiling",cls:"red"}], clock:""},
      {say:"One number tells you if you have enough workers: how many messages are <b>waiting</b>. Near zero, fine. Growing and growing, add workers or find the slow dependency. Alert on it.", msgs:six(), notes:[{x:70,y:290,text:"ApproximateNumberOfMessagesVisible",cls:""}], clock:""},
    ]
  });
}

// 6. Order pipeline happy path
{
  const B = [
    box("web",20,40,110,56,"Web","web"),
    box("q1",160,30,150,76,"reserve_stock","queue"),
    box("q2",340,30,150,76,"charge_card","queue"),
    box("q3",520,30,150,76,"send_receipt","queue"),
    box("q4",700,30,150,76,"update_inventory","queue"),
    box("w1",160,150,150,60,"stock worker","worker"),
    box("w2",340,150,150,60,"charge worker","worker"),
    box("w3",520,150,150,60,"receipt worker","worker"),
    box("w4",700,150,150,60,"inventory worker","worker"),
    box("db",160,260,690,70,"orders table (SQLite)","db","order 42 · status: —"),
  ];
  const S = (status)=>({db:"order 42 · status: "+status});
  CASES.push({
    title:"6. The order pipeline, happy path",
    remember:"One queue per step. The message carries only the order id. Every worker reads the truth from the database, does its step, writes the result, and sends the next message.",
    boxes:B, arrows:[["web","q1"],["q1","w1"],["w1","q2"],["q2","w2"],["w2","q3"],["q3","w3"],["w3","q4"],["q4","w4"]],
    steps:[
      {say:"Customer buys. Web server creates the order row with status <b>pending</b> and sends one small message to the first queue: just <span class='mono'>order 42</span>. Then answers “order received”.", msgs:{m:{at:"q1",slot:0,label:"order 42"}}, hot:["web"], subs:S("pending")},
      {say:"The stock worker reads only its own queue. It looks up order 42 in the database, reserves the items, writes status <b>stock_reserved</b>, sends <span class='mono'>order 42</span> to the charge queue, then acks its own message.", msgs:{m:{at:"q2",slot:0,label:"order 42"}}, hot:["w1"], ok:["w1"], subs:S("stock_reserved · reserved 2 items")},
      {say:"Charge worker: look up order 42, see stock_reserved, call the payment provider, write <b>charged</b> plus the charge id, send to receipt queue, ack.", msgs:{m:{at:"q3",slot:0,label:"order 42"}}, hot:["w2"], ok:["w1","w2"], subs:S("charged · ch_8f2a")},
      {say:"Receipt worker: look up, email the customer, write <b>receipt_sent</b>, send to inventory queue, ack. This is past the point of no return: an email can't be unsent, so this step must never be the reason an order is rolled back.", msgs:{m:{at:"q4",slot:0,label:"order 42"}}, hot:["w3"], ok:["w1","w2","w3"], subs:S("receipt_sent")},
      {say:"Inventory worker: convert reserved to sold, write <b>completed</b>, ack. No next message. Four steps, four workers, none of them ever spoke to each other. The database row is the only shared memory.", msgs:{m:{at:"q4",slot:0,gone:true}}, ok:["w1","w2","w3","w4"], subs:S("completed ✓")},
    ]
  });
}

// 7. Compensation
{
  const B = [
    box("q1",40,30,170,76,"reserve_stock","queue"),
    box("q2",240,30,170,76,"charge_card","queue"),
    box("qr",470,30,190,76,"release_stock","queue","the undo queue"),
    box("w2",240,150,170,60,"charge worker","worker"),
    box("wr",470,150,190,60,"release worker","worker"),
    box("pp",700,150,180,60,"Payment provider","provider","fake Stripe"),
    box("db",40,260,840,70,"orders + inventory (SQLite)","db","order 42 · stock_reserved · reserved: 2"),
  ];
  const S=(t)=>({db:t});
  CASES.push({
    title:"7. Card declined: undoing step 1",
    remember:"The undo is its own message. Its retries only retry the undo, never the charge.",
    boxes:B, arrows:[["q1","q2"],["q2","w2"],["w2","pp"],["w2","qr"],["qr","wr"]],
    steps:[

// ---------- renderer ----------
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
let ci = 0, si = 0, timer = null;
let msgEls = {};

function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||svg).appendChild(e); return e; }

function buildScene(c){
  svg.innerHTML = "";
  msgEls = {};
  const defs = el("defs",{});
  const mk = el("marker",{id:"ah",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);
  el("path",{d:"M0 0 L10 5 L0 10 z",fill:"var(--line)"},mk);
  const byId = Object.fromEntries(c.boxes.map(b=>[b.id,b]));
  for(const [a,b] of c.arrows){
    const A=byId[a], Bx=byId[b];
    const ax=A.x+A.w, ay=A.y+A.h/2, bx=Bx.x, by=Bx.y+Bx.h/2;
    let d;
    if(Bx.x > A.x+A.w-1 && Math.abs(ay-by)<2) d=`M${ax} ${ay} L${bx} ${by}`;
    else if(Bx.x >= A.x+A.w-1){ const mx=(ax+bx)/2; d=`M${ax} ${ay} C${mx} ${ay} ${mx} ${by} ${bx} ${by}`; }
    else { // vertical-ish
      const sx=A.x+A.w/2, sy=A.y+A.h, tx=Bx.x+Bx.w/2, ty=Bx.y; const my=(sy+ty)/2;
      d=`M${sx} ${sy} C${sx} ${my} ${tx} ${my} ${tx} ${ty}`;
    }
    el("path",{d,class:"arrow"});
  }
  for(const b of c.boxes){
    const g = el("g",{id:"box-"+b.id});
    el("rect",{x:b.x,y:b.y,width:b.w,height:b.h,class:"box "+b.kind},g);
    el("text",{x:b.x+10,y:b.y+18,class:"lbl"},g).textContent=b.label;
    const sub = el("text",{x:b.x+10,y:b.y+b.h-8,class:"sub",id:"sub-"+b.id},g); sub.textContent=b.sub;
    if(b.kind==="queue"||b.kind==="dlq"){
      const cols=Math.max(1,Math.floor((b.w-16)/(SLOT_W+6)));
      const rows=Math.max(1,Math.floor((b.h-44)/(SLOT_H+6)));
      for(let i=0;i<cols*rows;i++){ const p=msgPos(b,i); el("rect",{x:p.x,y:p.y,width:SLOT_W,height:SLOT_H,rx:5,class:"slot"},g); }
    }
  }
  el("text",{x:880,y:24,class:"clock",id:"clock","text-anchor":"end"});
  el("g",{id:"notes"});
  el("g",{id:"msgs"});
}

function ensureMsg(id){
  if(msgEls[id]) return msgEls[id];
  const g = el("g",{class:"msg gone"}, document.getElementById("msgs"));
  el("rect",{x:0,y:0,width:SLOT_W,height:SLOT_H},g);
  el("text",{x:SLOT_W/2,y:SLOT_H/2+4,"text-anchor":"middle"},g);
  const cg = el("g",{class:"cnt"},g); el("circle",{cx:SLOT_W-2,cy:2,r:8},cg); el("text",{x:SLOT_W-2,y:5.5,"text-anchor":"middle"},cg);
  cg.style.display="none";
  msgEls[id]=g; return g;
}

function render(){
  const c = CASES[ci], s = c.steps[si];
  const byId = Object.fromEntries(c.boxes.map(b=>[b.id,b]));
  document.getElementById("caseTitle").textContent=c.title;
  document.getElementById("stepLabel").textContent=`step ${si+1} / ${c.steps.length}`;
  document.getElementById("say").innerHTML=s.say;
  document.getElementById("remember").textContent=c.remember;
  document.getElementById("clock").textContent=s.clock||"";
  // boxes state
  for(const b of c.boxes){
    const r=document.querySelector("#box-"+b.id+" rect.box");
    r.classList.toggle("hot",!!(s.hot&&s.hot.includes(b.id)));
    r.classList.toggle("crash",!!(s.crash&&s.crash.includes(b.id)));
    r.classList.toggle("ok",!!(s.ok&&s.ok.includes(b.id)));
    document.getElementById("sub-"+b.id).textContent=(s.subs&&s.subs[b.id]!=null)?s.subs[b.id]:b.sub;
  }
  // notes
  const notes=document.getElementById("notes"); notes.innerHTML="";
  for(const n of (s.notes||[])){ el("text",{x:n.x,y:n.y,class:"note "+(n.cls||"")},notes).textContent=n.text; }
  // messages: anything not mentioned this step is hidden
  const seen=new Set();
  for(const id in s.msgs){
    const m=s.msgs[id]; seen.add(id);
    const g=ensureMsg(id);
    if(m.gone){ g.classList.add("gone"); continue; }
    const b=byId[m.at]; const p=msgPos(b,m.slot||0);
    g.style.transform=`translate(${p.x}px,${p.y}px)`;
    g.classList.remove("gone");
    g.classList.toggle("hidden",!!m.hidden);
    g.classList.toggle("dead",!!m.dead);
    g.querySelector("text").textContent=m.label||"";
    const cg=g.querySelector(".cnt");
    if(m.count!=null){ cg.style.display=""; cg.querySelector("text").textContent=m.count; } else cg.style.display="none";
  }
  for(const id in msgEls) if(!seen.has(id)) msgEls[id].classList.add("gone");
  document.getElementById("prev").disabled = si===0;
  document.getElementById("next").disabled = si===c.steps.length-1;
  document.querySelectorAll("#nav button").forEach((b,i)=>b.setAttribute("aria-current",i===ci?"true":"false"));
  try{ localStorage.setItem("qp.pos",JSON.stringify([ci,si])); }catch(e){}
}

function go(c,s){
  stopPlay();
  if(c!==ci){ ci=c; buildScene(CASES[ci]); si=0; }
  si=Math.max(0,Math.min(CASES[ci].steps.length-1,s));
  // new messages must first appear at their position without animating from 0,0
  const fresh = Object.keys(CASES[ci].steps[si].msgs||{}).filter(id=>!msgEls[id]);
  if(fresh.length){ svg.classList.add("noanim"); }
  render();
  if(fresh.length){ svg.getBoundingClientRect(); svg.classList.remove("noanim"); }
}
function next(){ if(si<CASES[ci].steps.length-1) go(ci,si+1); else if(ci<CASES.length-1) go(ci+1,0); else stopPlay(); }
function prev(){ if(si>0) go(ci,si-1); }
function stopPlay(){ if(timer){ clearInterval(timer); timer=null; document.getElementById("play").textContent="Play"; } }
function togglePlay(){
  if(timer) return stopPlay();
  document.getElementById("play").textContent="Pause";
  timer=setInterval(()=>{ const atEnd = si===CASES[ci].steps.length-1 && ci===CASES.length-1; if(atEnd) return stopPlay(); const keep=timer; next(); timer=keep; document.getElementById("play").textContent="Pause"; }, 4200);
}

// nav
const nav=document.getElementById("nav");
CASES.forEach((c,i)=>{ const b=document.createElement("button"); b.innerHTML=`<span class="n">${i+1}</span><span>${c.title.replace(/^\d+\.\s*/,"")}</span>`; b.onclick=()=>go(i,0); nav.appendChild(b); });
document.getElementById("prev").onclick=prev;
document.getElementById("next").onclick=()=>{ stopPlay(); next(); };
document.getElementById("play").onclick=togglePlay;
document.getElementById("reset").onclick=()=>go(ci,0);
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="BUTTON"&&e.key===" ") return;
  if(e.key==="ArrowRight"){ stopPlay(); next(); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ prev(); e.preventDefault(); }
  else if(e.key===" "){ togglePlay(); e.preventDefault(); }
});

const style=document.createElement("style"); style.textContent="svg.noanim .msg{transition:none !important}"; document.head.appendChild(style);

let start=[0,0]; try{ const p=JSON.parse(localStorage.getItem("qp.pos")); if(Array.isArray(p)&&CASES[p[0]]&&CASES[p[0]].steps[p[1]]) start=p; }catch(e){}
buildScene(CASES[start[0]]); ci=start[0]; si=start[1]; svg.classList.add("noanim"); render(); svg.getBoundingClientRect(); svg.classList.remove("noanim");
</script>
